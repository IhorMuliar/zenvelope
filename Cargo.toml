[workspace]
resolver = "2"
members = ["crates/core", "crates/spike-witness", "crates/spike-prove"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/IhorMuliar/zenvelope"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
