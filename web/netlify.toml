# Netlify deployment for the Zenvelope web app.
#
# The headers below are the same set as `public/_headers`, which is the file
# Cloudflare Pages reads. Netlify reads both — `_headers` from the publish
# directory and this file — and they are kept byte-for-byte equivalent on
# purpose: `src/lib/headers.test.ts` fails the build if they drift, and
# `index.html` carries the same policy as a `<meta>` fallback for any host that
# reads neither (H2).
#
# The "Powered by Netlify" badge must stay OFF for this project (Project
# configuration > General; API field `built_with_badge_enabled`). Netlify injects
# it at the edge as a same-origin script that builds an iframe from inline
# script and style, which our CSP blocks: that was every console CSP error on
# the live site on 2026-09-24. A script we did not ship has no business running
# on the page that holds the envelope secret, so it is off, not allowed.
#
# Nothing here is a secret. `VITE_FEE_ADDRESS` is set in the host's build
# environment, never in this file: it decides where the flat fee goes, and the
# repository has no business knowing it.

[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"

  [headers.values]
    # Cross-origin isolation, which SharedArrayBuffer and therefore the threaded
    # proving core require. Without these the core worker falls back to the
    # single-threaded package and a proof takes about twice as long.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    # Belt and braces with the CSP's frame-ancestors: a page that can be framed
    # is a page whose URL fragment somebody else's chrome can be drawn around.
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    # A link is a bearer capability, so a single downgrade to http is a disclosed
    # secret. One year, subdomains included; `preload` is deliberately left off
    # until a domain of our own exists to submit (DECISIONS D9).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; connect-src 'self' https://zjs.zec.rocks https://zcash-mainnet.chainsafe.dev https://zcash-testnet.chainsafe.dev https://1click.chaindefuser.com"

# The app is a single-page one: every path renders index.html and the router
# reads the path. Mirrors public/_redirects, which is what Cloudflare Pages uses.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
