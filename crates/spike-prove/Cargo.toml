[package]
name = "zenvelope-spike-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "THROWAWAY M3 spike: can a single-threaded browser WASM build the Orchard/Ironwood proving key and produce one bundle proof?"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `multicore` is OFF: halo2 would pull rayon, which needs threads a plain
# `--target web` build does not have. `circuit` brings halo2_proofs/halo2_gadgets and std.
orchard = { version = "0.15.5", default-features = false, features = ["circuit"] }
incrementalmerkletree = "0.8.1"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

# Something in the orchard dependency tree pulls getrandom 0.2, which refuses to compile
# for wasm32-unknown-unknown unless the `js` backend is named. (crates/core's getrandom is
# 0.3, whose backend comes from the cfg in .cargo/config.toml; this is the other one.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# rustc emits post-MVP wasm that the bundled wasm-opt rejects unless each feature is named.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-multivalue",
]
